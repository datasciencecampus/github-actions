name: GitHub Actions Security Analysis with zizmor 🌈
run-name: "zizmor - ${{ github.actor }} - ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"

"on":
  workflow_call:
    inputs:
      config-path:
        description: Path to the zizmor config file.
        required: false
        type: string
        default: ./configs/zizmor.yaml
      advanced-security:
        description: >-
          Upload SARIF results to GitHub Advanced Security.
          Auto-enabled for public repositories, auto-disabled for private repositories.
          Set to true to force enable, or false to force disable.
        required: false
        type: boolean
        default: false
      persona:
        description: Persona for zizmor analysis (regular, pedantic, auditor).
        required: false
        type: string
        default: auditor

permissions:
  contents: read

jobs:
  zizmor:
    name: Run zizmor
    runs-on: ubuntu-latest
    permissions:
      actions: read # Required for SARIF upload metadata lookups in private or internal repositories.
      contents: read # Required to read repository contents during analysis, especially for private or internal repositories.
      security-events: write # Required to upload SARIF results to GitHub Advanced Security.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          config: ${{ inputs['config-path'] || './configs/zizmor.yaml' }}
          advanced-security: ${{ inputs['advanced-security'] }}
          persona: ${{ inputs.persona || 'auditor' }}
