name: Test Add Issue To Projects Reusable Workflow

'on':
  workflow_dispatch:
    inputs:
      project_field_values:
        description: >-
          JSON list of project mappings, for example
          [{"project":1234}] or [{"project":1234,"field":"Status","value":"Review"}]
        required: true
        type: string
      issue_node_id:
        description: Issue node id for a manual test run.
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-add-issue-to-projects-reusable:
    uses: ./.github/workflows/add-issue-to-projects.yml
    secrets:
      PROJECT_ROUTER_BOT_PRIVATE_KEY: ${{ secrets.PROJECT_ROUTER_BOT_PRIVATE_KEY }}
    with:
      repository: ${{ github.event.repository.name }}
      issue_node_id: ${{ inputs.issue_node_id }}
      project_field_values: ${{ inputs.project_field_values }}
