name: Test Add Pull Request To Projects

'on':
  pull_request:
    types: [opened]
  workflow_dispatch:
    inputs:
      project_field_values:
        description: >-
          JSON list of mappings, for example
          [{"project":194,"field":"Status","value":"Review"}]
        required: false
        type: string
      pull_request_node_id:
        description: Optional pull request node id for manual tests.
        required: false
        type: string

permissions:
  contents: read

jobs:
  test-add-pr-to-projects:
    runs-on: ubuntu-latest
    steps:
      - name: Validate dispatch payload inputs
        env:
          PULL_REQUEST_NODE_ID: ${{ inputs.pull_request_node_id || github.event.pull_request.node_id || '' }}
        run: |
          if [ -z "$PULL_REQUEST_NODE_ID" ]; then
            echo "Missing pull request node id."
            echo "For workflow_dispatch, provide the pull_request_node_id input."
            exit 1
          fi

      - name: Validate app credentials
        env:
          PROJECT_ROUTER_BOT_APP_ID: ${{ vars.PROJECT_ROUTER_BOT_APP_ID }}
          PROJECT_ROUTER_BOT_PEM: ${{ secrets.PROJECT_ROUTER_BOT_PEM }}
        run: |
          if [ -z "$PROJECT_ROUTER_BOT_APP_ID" ]; then
            echo "Missing variable PROJECT_ROUTER_BOT_APP_ID."
            exit 1
          fi

          if [ -z "$PROJECT_ROUTER_BOT_PEM" ]; then
            echo "Missing secret PROJECT_ROUTER_BOT_PEM."
            exit 1
          fi

      - name: Create GitHub App token for dispatch
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PROJECT_ROUTER_BOT_APP_ID }}
          private-key: ${{ secrets.PROJECT_ROUTER_BOT_PEM }}
          owner: datasciencecampus
          repositories: github-actions
          permission-actions: write

      - name: Dispatch add-pr-to-projects workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PROJECT_FIELD_VALUES: ${{ inputs.project_field_values || vars.TEST_PR_PROJECT_FIELD_VALUES || '[{"project":194,"field":"Status","value":"Review"}]' }}
          PULL_REQUEST_NODE_ID: ${{ inputs.pull_request_node_id || github.event.pull_request.node_id || '' }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          REF: ${{ github.ref_name }}
        run: |
          jq -n \
            --arg ref "$REF" \
            --arg repo "$REPOSITORY_NAME" \
            --arg node_id "$PULL_REQUEST_NODE_ID" \
            --arg project_field_values "$PROJECT_FIELD_VALUES" \
            '{
              ref: $ref,
              inputs: {
                repository: $repo,
                pull_request_node_id: $node_id,
                project_field_values: $project_field_values
              }
            }' > payload.json

          curl -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/datasciencecampus/github-actions/actions/workflows/add-pr-to-projects.yml/dispatches \
            -d @payload.json