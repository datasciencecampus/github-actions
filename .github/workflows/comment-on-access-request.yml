name: Comment On Access Request

'on':
  issues:
    types:
      - opened

permissions:
  contents: read

jobs:
  comment-on-access-request:
    name: Label issue and post reviewer instructions
    if: ${{ contains(join(github.event.issue.labels.*.name, ','), 'access-request') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Post reviewer instructions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: python
        run: |
          import json
          import os
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          api_url = os.environ["GITHUB_API_URL"]
          repository = os.environ["GITHUB_REPOSITORY"]
          issue_number = os.environ["ISSUE_NUMBER"]

          def github_request(method, url, payload):
              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
                  method=method,
              )
              with urllib.request.urlopen(request) as response:
                  if response.status >= 300:
                      raise RuntimeError(
                          f"GitHub API request failed: {method} {url} -> {response.status}"
                      )

          issue_api_url = f"{api_url}/repos/{repository}/issues/{issue_number}"

          body = (
              "Reviewer guidance:\n\n"
              "Please check:\n"
              "- the repository name is correct and belongs to this organisation\n"
              "- the listed project numbers are valid and should be granted to that repository\n"
              "- adding this repository to the shared allowlist is appropriate\n\n"
              "If you are satisfied:\n"
              "- close this issue as completed\n"
              "- approve the follow-up environment review when the allowlist update workflow pauses\n\n"
              "If you are not satisfied:\n"
              "- request changes in this issue, or close it without marking it as completed\n\n"
              "The allowlist update workflow does not run until the issue is closed as completed."
          )
          github_request("POST", f"{issue_api_url}/comments", {"body": body})