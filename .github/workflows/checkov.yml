name: Checkov Infrastructure Security Scan
run-name: "Checkov - ${{ github.actor }} - ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"

"on":
  workflow_call:
    inputs:
      config-path:
        description: Path to the Checkov config file.
        required: false
        type: string
        default: ./configs/checkov.yml
      advanced-security:
        description: >-
          Upload SARIF results to GitHub Advanced Security.
          Auto-enabled for public repositories, auto-disabled for private repositories.
          Set to true to force enable, or false to force disable.
        required: false
        type: boolean
        default: false

permissions: {} # Deny token access by default; jobs grant only what they need.

jobs:
  checkov:
    name: checkov
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to check out and scan repository content.
      security-events: write # Required to upload SARIF results to GitHub Advanced Security.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkov GitHub Action
        uses: bridgecrewio/checkov-action@5798bad4f6dd9c1fb67ae3ec10d42d8fb67037c4 # v12.3126.0
        with:
          config_file: ${{ inputs['config-path'] || './configs/checkov.yml' }}
          directory: "."
          output_format: cli,sarif
          output_file_path: console,results.sarif
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: (success() || failure()) && inputs['advanced-security']
        with:
          sarif_file: results.sarif
