name: Update Project Routing Allowlist

'on':
  issues:
    types:
      - closed

permissions:
  contents: read

jobs:
  update-allowlist:
    name: Update allowlist variables
    if: ${{ github.event.issue.state_reason == 'completed' && contains(join(github.event.issue.labels.*.name, ','), 'access-request') }}
    runs-on: ubuntu-latest
    environment:
            name: ${{ vars.PROJECT_ROUTER_ADMIN_ENVIRONMENT || 'project-automation-admin' }}
    permissions:
      actions: write
      contents: read
      issues: read
    steps:
      - name: Update environment variables
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        shell: python
        run: |
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          ISSUE_BODY = os.environ.get("ISSUE_BODY", "")
          OWNER = os.environ.get("GITHUB_REPOSITORY_OWNER", "").strip()
          REPOSITORY = os.environ.get("GITHUB_REPOSITORY", "").strip()
          TOKEN = os.environ.get("GITHUB_TOKEN", "").strip()
          TARGET_ENVIRONMENT = "project-automation"

          if not ISSUE_BODY:
              print("Issue body is empty.")
              sys.exit(1)

          if not OWNER or not REPOSITORY or not TOKEN:
              print("Missing required GitHub Actions context.")
              sys.exit(1)

          def extract_section(title):
              pattern = rf"(?:^|\n)### {re.escape(title)}\n(.*?)(?=\n### |\Z)"
              match = re.search(pattern, ISSUE_BODY, re.S)
              if not match:
                  raise RuntimeError(f"Could not find issue form section '{title}'.")
              return match.group(1).strip()

          def normalize_repository_name(raw_value):
              value = raw_value.strip().strip("`")
              if not value:
                  raise RuntimeError("Repository name is empty.")
              if "/" in value:
                  owner, name = value.split("/", 1)
                  if owner != OWNER:
                      raise RuntimeError(
                          f"Repository owner '{owner}' is not allowed. Expected '{OWNER}'."
                      )
                  value = name
              if not re.fullmatch(r"[A-Za-z0-9._-]+", value):
                  raise RuntimeError(
                      f"Repository name '{value}' contains unsupported characters."
                  )
              return value

          def parse_project_numbers(raw_value):
              project_numbers = []
              for line in raw_value.splitlines():
                  text = line.strip()
                  if not text:
                      continue
                  match = re.match(r"-?\s*(\d+)", text)
                  if not match:
                      raise RuntimeError(
                          "Each project line must start with a numeric project number."
                      )
                  project_number = int(match.group(1))
                  if project_number not in project_numbers:
                      project_numbers.append(project_number)
              if not project_numbers:
                  raise RuntimeError("No project numbers were provided in the issue form.")
              return sorted(project_numbers)

          def github_request(method, url, payload=None, allow_not_found=False):
              headers = {
                  "Authorization": f"Bearer {TOKEN}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              data = None
              if payload is not None:
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request) as response:
                      body = response.read().decode("utf-8")
              except urllib.error.HTTPError as exc:
                  if allow_not_found and exc.code == 404:
                      return None
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"GitHub API request failed: {method} {url} -> {exc.code} {detail}"
                  ) from exc
              if not body:
                  return {}
              return json.loads(body)

          def variable_url(name):
              environment = urllib.parse.quote(TARGET_ENVIRONMENT, safe="")
              variable_name = urllib.parse.quote(name, safe="")
              return (
                  f"https://api.github.com/repos/{REPOSITORY}/environments/"
                  f"{environment}/variables/{variable_name}"
              )

          def read_json_variable(name, default):
              response = github_request("GET", variable_url(name), allow_not_found=True)
              if response is None:
                  return default
              value = response.get("value", "")
              if not value:
                  return default
              try:
                  parsed = json.loads(value)
              except Exception as exc:
                  raise RuntimeError(f"Environment variable '{name}' does not contain valid JSON.") from exc
              return parsed

          def write_json_variable(name, value):
              github_request(
                  "PUT",
                  variable_url(name),
                  {
                      "name": name,
                      "value": json.dumps(value, separators=(",", ":")),
                  },
              )

          requested_repository = normalize_repository_name(extract_section("Repository name"))
          requested_projects = parse_project_numbers(extract_section("Approved project numbers"))

          allowed_repositories = read_json_variable("PROJECT_ROUTER_ALLOWED_REPOSITORIES", [])
          if not isinstance(allowed_repositories, list):
              raise RuntimeError("PROJECT_ROUTER_ALLOWED_REPOSITORIES must be a JSON array.")
          normalized_repositories = []
          for item in allowed_repositories:
              repo_name = str(item).strip()
              if repo_name and repo_name not in normalized_repositories:
                  normalized_repositories.append(repo_name)
          if requested_repository not in normalized_repositories:
              normalized_repositories.append(requested_repository)
          normalized_repositories.sort()

          allowed_projects = read_json_variable("PROJECT_ROUTER_ALLOWED_PROJECTS", {})
          if not isinstance(allowed_projects, dict):
              raise RuntimeError("PROJECT_ROUTER_ALLOWED_PROJECTS must be a JSON object.")
          existing_projects = allowed_projects.get(requested_repository, [])
          if not isinstance(existing_projects, list):
              raise RuntimeError(
                  f"PROJECT_ROUTER_ALLOWED_PROJECTS entry for '{requested_repository}' must be a JSON array."
              )

          merged_projects = []
          for item in existing_projects:
              project_number = int(item)
              if project_number not in merged_projects:
                  merged_projects.append(project_number)
          for project_number in requested_projects:
              if project_number not in merged_projects:
                  merged_projects.append(project_number)
          allowed_projects[requested_repository] = sorted(merged_projects)

          write_json_variable("PROJECT_ROUTER_ALLOWED_REPOSITORIES", normalized_repositories)
          write_json_variable("PROJECT_ROUTER_ALLOWED_PROJECTS", allowed_projects)

          print(
              f"Updated allowlist for repository '{requested_repository}' with projects "
              f"{sorted(allowed_projects[requested_repository])}."
          )