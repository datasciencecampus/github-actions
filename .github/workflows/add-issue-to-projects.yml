name: Add Issue To Org Projects

'on':
  repository_dispatch:
    types:
      - add-issue-to-projects

permissions:
  contents: read
  issues: read
  repository-projects: write

jobs:
  add-issue-to-projects:
    runs-on: ubuntu-latest
    environment: project-automation
    timeout-minutes: 10
    steps:
      - name: Validate app credentials
        env:
          PROJECT_HANDLER_BOT_APP_ID: ${{ vars.PROJECT_HANDLER_BOT_APP_ID }}
          PROJECT_HANDLER_BOT_PEM: ${{ secrets.PROJECT_HANDLER_BOT_PEM }}
        run: |
          if [ -z "$PROJECT_HANDLER_BOT_APP_ID" ]; then
            echo "Missing variable PROJECT_HANDLER_BOT_APP_ID."
            echo "Create it as an organization Actions variable and grant access to calling repositories."
            exit 1
          fi

          if [ -z "$PROJECT_HANDLER_BOT_PEM" ]; then
            echo "Missing secret PROJECT_HANDLER_BOT_PEM."
            echo "Create it as an organization Actions secret and grant access to calling repositories."
            exit 1
          fi

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PROJECT_HANDLER_BOT_APP_ID }}
          private-key: ${{ secrets.PROJECT_HANDLER_BOT_PEM }}
          owner: datasciencecampus
          repositories: ${{ github.event.client_payload.repository || github.event.repository.name }}
          permission-organization-projects: write
          permission-issues: read

      - name: Add issue to projects (Python)
        env:
          PROJECT_NUMBERS: ${{ github.event.client_payload.project_numbers }}
          ISSUE_NODE_ID: ${{ github.event.client_payload.issue_node_id }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        shell: python
        run: |
          import json
          import os
          import sys
          import urllib.request

          ORG = "datasciencecampus"

          def graphql(token, query, variables):
              payload = json.dumps({"query": query, "variables": variables}).encode("utf-8")
              req = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=payload,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "Accept": "application/vnd.github+json",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read().decode("utf-8"))
              if result.get("errors"):
                  raise RuntimeError(json.dumps(result["errors"]))
              return result.get("data", {})

          def parse_project_numbers(raw):
              raw = (raw or "").strip()
              if not raw:
                  return []

              parsed = []
              for part in raw.replace(",", "\n").splitlines():
                  value = part.strip()
                  if not value:
                      continue
                  if value.startswith("[") and value.endswith("]"):
                      value = value[1:-1].strip().strip('"\'')
                  if not value.isdigit():
                      raise ValueError(f"Invalid project number: {value}")
                  project_number = int(value)
                  if project_number not in parsed:
                      parsed.append(project_number)

              if len(parsed) > 100:
                  raise ValueError("Too many project numbers requested. Maximum is 100.")

              return parsed

          def get_issue_node_id(input_node_id):
              if input_node_id:
                  return input_node_id
              event_path = os.environ.get("GITHUB_EVENT_PATH", "")
              if not event_path:
                  return ""
              with open(event_path, "r", encoding="utf-8") as fh:
                  event = json.load(fh)
              return event.get("issue", {}).get("node_id", "")

          def get_project(token, number):
              query = """
              query($org: String!, $number: Int!) {
                organization(login: $org) {
                  projectV2(number: $number) {
                    id
                    number
                    title
                  }
                }
              }
              """
              data = graphql(token, query, {"org": ORG, "number": number})
              return data.get("organization", {}).get("projectV2")

          def find_existing_item(token, project_id, issue_node_id):
              query = """
              query($projectId: ID!, $cursor: String) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    items(first: 100, after: $cursor) {
                      nodes {
                        id
                        content {
                          ... on Issue {
                            id
                          }
                        }
                      }
                      pageInfo {
                        hasNextPage
                        endCursor
                      }
                    }
                  }
                }
              }
              """
              cursor = None
              while True:
                  data = graphql(token, query, {"projectId": project_id, "cursor": cursor})
                  items = data.get("node", {}).get("items", {})
                  for item in items.get("nodes", []):
                      content = item.get("content") or {}
                      if content.get("id") == issue_node_id:
                          return item.get("id")
                  page_info = items.get("pageInfo", {})
                  if not page_info.get("hasNextPage"):
                      return ""
                  cursor = page_info.get("endCursor")

          def add_item(token, project_id, issue_node_id):
              mutation = """
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                  item {
                    id
                  }
                }
              }
              """
              data = graphql(
                  token,
                  mutation,
                  {"projectId": project_id, "contentId": issue_node_id},
              )
              return (
                  data.get("addProjectV2ItemById", {})
                  .get("item", {})
                  .get("id", "")
              )

          token = os.environ.get("GITHUB_TOKEN", "")
          try:
              project_numbers = parse_project_numbers(os.environ.get("PROJECT_NUMBERS", ""))
          except ValueError as exc:
              print(str(exc))
              sys.exit(1)

          issue_node_id = get_issue_node_id(os.environ.get("ISSUE_NODE_ID", ""))

          if not token:
              print("Missing app token.")
              sys.exit(1)

          if not project_numbers:
              print("No project numbers were provided.")
              sys.exit(1)

          if not issue_node_id:
              print("Unable to resolve issue node id from input or event payload.")
              sys.exit(1)

          for project_number in project_numbers:
              project = get_project(token, project_number)
              if not project:
                  print(f"Project #{project_number} was not found in {ORG}.")
                  sys.exit(1)

              project_id = project["id"]
              existing_item_id = find_existing_item(token, project_id, issue_node_id)
              if existing_item_id:
                  print(f"Issue already present in project #{project_number}.")
                  continue

              new_item_id = add_item(token, project_id, issue_node_id)
              if not new_item_id:
                  print(f"Failed to add issue to project #{project_number}.")
                  sys.exit(1)

              print(f"Added issue to project #{project_number}.")
