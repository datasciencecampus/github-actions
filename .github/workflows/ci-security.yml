name: CI Security
run-name: ${{ github.workflow }} - ${{ github.actor }} ${{ github.event_name == 'pull_request' && 'opened PR to' || github.event_name == 'workflow_dispatch' && 'manually triggered on' || 'pushed a change to' }} ${{ github.ref_name }}

"on":
  workflow_call:
    inputs:
      checkov-config-path:
        description: Path to the Checkov config file.
        required: false
        type: string
      checkov-advanced-security:
        description: Upload Checkov SARIF results to GitHub Advanced Security.
        required: false
        type: boolean
        default: true
      zizmor-config-path:
        description: Path to the zizmor config file.
        required: false
        type: string
      zizmor-persona:
        description: Persona for zizmor analysis (regular, pedantic, auditor).
        required: false
        type: string
        default: pedantic
      zizmor-advanced-security:
        description: Upload zizmor SARIF results to GitHub Advanced Security.
        required: false
        type: boolean
        default: false
  push:
  pull_request:
    branches: ["main"]

permissions: {} # Deny token access by default; jobs grant only what they need.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checkov:
    uses: ./.github/workflows/checkov.yml
    permissions:
      contents: read # Required to check out and scan repository content.
      security-events: write # Required to upload SARIF results to GitHub Advanced Security.
    with:
      config-path: ${{ inputs.checkov-config-path }}
      advanced-security: ${{ inputs.checkov-advanced-security }}

  zizmor:
    uses: ./.github/workflows/zizmor.yml
    permissions:
      actions: read # Required for SARIF upload metadata lookups in private or internal repositories.
      contents: read # Required to read repository contents during analysis, especially for private or internal repositories.
      security-events: write # Required to upload SARIF results to GitHub Advanced Security.
    with:
      config-path: ${{ inputs.zizmor-config-path }}
      persona: ${{ inputs.zizmor-persona }}
      advanced-security: ${{ inputs.zizmor-advanced-security }}
