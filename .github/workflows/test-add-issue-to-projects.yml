name: Test Add Issue To Projects

'on':
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      project_numbers:
        description: Comma or newline separated project numbers for test run.
        required: false
        type: string
      issue_node_id:
        description: Optional issue node id for manual tests.
        required: false
        type: string

permissions:
  contents: read

jobs:
  test-add-issue-to-projects:
    runs-on: ubuntu-latest
    steps:
      - name: Validate dispatch payload inputs
        env:
          ISSUE_NODE_ID: ${{ inputs.issue_node_id || github.event.issue.node_id || '' }}
        run: |
          if [ -z "$ISSUE_NODE_ID" ]; then
            echo "Missing issue node id."
            echo "For workflow_dispatch, provide the issue_node_id input."
            exit 1
          fi

      - name: Validate app credentials
        env:
          PROJECT_ROUTER_BOT_APP_ID: ${{ vars.PROJECT_ROUTER_BOT_APP_ID }}
          PROJECT_ROUTER_BOT_PEM: ${{ secrets.PROJECT_ROUTER_BOT_PEM }}
        run: |
          if [ -z "$PROJECT_ROUTER_BOT_APP_ID" ]; then
            echo "Missing variable PROJECT_ROUTER_BOT_APP_ID."
            exit 1
          fi

          if [ -z "$PROJECT_ROUTER_BOT_PEM" ]; then
            echo "Missing secret PROJECT_ROUTER_BOT_PEM."
            exit 1
          fi

      - name: Create GitHub App token for dispatch
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PROJECT_ROUTER_BOT_APP_ID }}
          private-key: ${{ secrets.PROJECT_ROUTER_BOT_PEM }}
          owner: datasciencecampus
          repositories: github-actions
          permission-actions: write

      - name: Dispatch add-issue-to-projects workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PROJECT_NUMBERS: ${{ inputs.project_numbers || vars.TEST_ISSUE_PROJECT_NUMBERS || '194,205' }}
          ISSUE_NODE_ID: ${{ inputs.issue_node_id || github.event.issue.node_id || '' }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          jq -n \
            --arg repo "$REPOSITORY_NAME" \
            --arg issue_node_id "$ISSUE_NODE_ID" \
            --arg project_numbers "$PROJECT_NUMBERS" \
            '{
              event_type: "add-issue-to-projects",
              client_payload: {
                repository: $repo,
                issue_node_id: $issue_node_id,
                project_numbers: $project_numbers
              }
            }' > payload.json

          curl -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/datasciencecampus/github-actions/dispatches \
            -d @payload.json
