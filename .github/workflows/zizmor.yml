name: GitHub Actions Security Analysis with zizmor 🌈
run-name: ${{ github.workflow }} - ${{ github.actor }} pushed a change to ${{ github.ref_name }}

'on':
  workflow_call:
    inputs:
      config-path:
        description: Path to the zizmor config file.
        required: false
        type: string
        default: ./configs/zizmor.yaml
      advanced-security:
        description: Upload SARIF results to GitHub Advanced Security.
        required: false
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      config-path:
        description: Path to the zizmor config file.
        required: false
        type: string
        default: ./configs/zizmor.yaml
      advanced-security:
        description: Upload SARIF results to GitHub Advanced Security.
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    name: Run zizmor
    runs-on: ubuntu-latest
    permissions:
      actions: read # Required for SARIF upload metadata lookups in private or internal repositories.
      contents: read # Required to read repository contents during analysis, especially for private or internal repositories.
      security-events: write # Required to upload SARIF results to GitHub Advanced Security.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          config: ${{ inputs.config-path || github.event.inputs.config-path || './configs/zizmor.yaml' }}
          advanced-security: ${{ inputs.advanced-security || github.event.inputs.advanced-security == 'true' || false }}
