name: Workflow & Infrastructure Security Analysis

run-name: "Security Analysis - ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || 'main' }}"

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      zizmor-config:
        description: Path to the zizmor config file.
        required: false
        type: string
      checkov-config:
        description: Path to the Checkov config file.
        required: false
        type: string
        default: ./configs/checkov.yml
      advanced-security:
        description: Upload SARIF results to GitHub Advanced Security.
        required: false
        type: boolean
        default: true
      zizmor-persona:
        description: Persona for zizmor analysis (regular, pedantic, auditor).
        required: false
        type: string
        default: pedantic

  workflow_dispatch:
    inputs:
      zizmor-config:
        description: Path to the zizmor config file.
        required: false
        type: string
      checkov-config:
        description: Path to the Checkov config file.
        required: false
        type: string
        default: ./configs/checkov.yml
      advanced-security:
        description: Upload SARIF results to GitHub Advanced Security.
        required: false
        type: boolean
        default: false
      zizmor-persona:
        description: Persona for zizmor analysis (regular, pedantic, auditor).
        required: false
        type: string
        default: pedantic

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {} # Deny token access by default; jobs grant only what they need.

jobs:
  zizmor:
    uses: ./.github/workflows/zizmor.yml
    with:
      config-path: ${{ inputs.zizmor-config || github.event.inputs.zizmor-config }}
      advanced-security: ${{ inputs.advanced-security || github.event.inputs.advanced-security == 'true' || false }}
      persona: ${{ inputs.zizmor-persona || github.event.inputs.zizmor-persona || 'pedantic' }}

  checkov:
    uses: ./.github/workflows/checkov.yml
    with:
      config-path: ${{ inputs.checkov-config }}
      advanced-security: ${{ inputs.advanced-security || github.event.inputs.advanced-security == 'true' || false }}
