name: Add Issue To Projects

'on':
  workflow_call:
    inputs:
      repository:
        description: Repository name the issue belongs to.
        required: true
        type: string
      issue_node_id:
        description: Node ID of the issue to add to projects.
        required: true
        type: string
      project_field_values:
        description: >-
          JSON list of project mappings, for example
          [{"project":194}] or [{"project":194,"field":"Status","value":"Review"}]
        required: true
        type: string
      organization:
        description: Organization login. Must match the owner of this repository.
        required: false
        type: string
    secrets:
      PROJECT_ROUTER_BOT_PRIVATE_KEY:
        description: Private key for the router GitHub App used to dispatch the implementation workflow.
        required: true

permissions:
  contents: read

jobs:
  add-issue-to-projects:
    runs-on: ubuntu-latest
    steps:
      - name: Validate dispatch inputs
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          ISSUE_NODE_ID: ${{ inputs.issue_node_id }}
        run: |
          ref="${WORKFLOW_REF##*@}"
          case "$ref" in
            refs/heads/*)
              ref="${ref#refs/heads/}"
              ;;
            refs/tags/*)
              ref="${ref#refs/tags/}"
              ;;
          esac

          if [ -z "$ref" ] || [ "$ref" = "$WORKFLOW_REF" ]; then
            echo "Unable to resolve a dispatchable workflow ref from '$WORKFLOW_REF'."
            exit 1
          fi

          if [ -z "$ref" ]; then
            echo "Missing dispatch ref."
            exit 1
          fi

          echo "REF=$ref" >> "$GITHUB_ENV"

          if [ -z "$TARGET_REPOSITORY" ]; then
            echo "Missing repository input."
            exit 1
          fi

          if [ -z "$ISSUE_NODE_ID" ]; then
            echo "Missing issue node id."
            exit 1
          fi

      - name: Validate app credentials
        env:
          PROJECT_ROUTER_BOT_APP_ID: ${{ vars.PROJECT_ROUTER_BOT_APP_ID }}
          PROJECT_ROUTER_BOT_PRIVATE_KEY: ${{ secrets.PROJECT_ROUTER_BOT_PRIVATE_KEY }}
        run: |
          if [ -z "$PROJECT_ROUTER_BOT_APP_ID" ]; then
            echo "Missing variable PROJECT_ROUTER_BOT_APP_ID."
            exit 1
          fi

          if [ -z "$PROJECT_ROUTER_BOT_PRIVATE_KEY" ]; then
            echo "Missing secret PROJECT_ROUTER_BOT_PRIVATE_KEY."
            exit 1
          fi

      - name: Create GitHub App token for dispatch
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PROJECT_ROUTER_BOT_APP_ID }}
          private-key: ${{ secrets.PROJECT_ROUTER_BOT_PRIVATE_KEY }}
          owner: datasciencecampus
          repositories: github-actions
          permission-actions: write

      - name: Dispatch add-issue-to-projects implementation workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY_NAME: ${{ inputs.repository }}
          ISSUE_NODE_ID: ${{ inputs.issue_node_id }}
          PROJECT_FIELD_VALUES: ${{ inputs.project_field_values }}
          ORGANIZATION: ${{ inputs.organization }}
        run: |
          jq -n \
            --arg ref "$REF" \
            --arg repo "$REPOSITORY_NAME" \
            --arg issue_node_id "$ISSUE_NODE_ID" \
            --arg project_field_values "$PROJECT_FIELD_VALUES" \
            --arg organization "$ORGANIZATION" \
            '{
              ref: $ref,
              inputs: {
                repository: $repo,
                issue_node_id: $issue_node_id,
                project_field_values: $project_field_values,
                organization: $organization
              }
            }' > payload.json

          curl -sS -L --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/datasciencecampus/github-actions/actions/workflows/add-issue-to-projects-impl.yml/dispatches \
            -d @payload.json